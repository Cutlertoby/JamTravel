# Netlify build configuration for the LocalPay news + admin app.
# The official Next.js plugin handles SSR, ISR, image optimisation, and
# middleware. Netlify auto-installs it when it detects Next.js; it's pinned
# here so builds are reproducible.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
