# Daily article generation.
#
# Netlify's own scheduled functions cap out well below the time Opus with
# thinking needs, so the schedule lives here and fires the existing 15-minute
# background function over HTTP instead.
name: Daily article

on:
  schedule:
    # Staggered across the three sites so they don't all generate at once.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      status:
        description: "Where the article lands"
        type: choice
        default: published
        options: [published, pending_review]
      prompt:
        description: "Optional topic steer (blank = automatic)"
        type: string
        default: ""

concurrency: daily-article

env:
  SITE_KEY: positivejamtravel
  ORIGIN: https://positivejamfest.com
  # The same publishable anon key the site already ships in its client bundle.
  SUPABASE_URL: https://etduovglrefjxotzypua.supabase.co
  SUPABASE_KEY: sb_publishable_iHTTar0UlHZEVpNU0s6ukA_iYMhSzD0

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Record the newest existing article
        id: before
        run: |
          ROW=$(curl -sS -G "$SUPABASE_URL/rest/v1/posts" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            --data-urlencode "select=slug" \
            --data-urlencode "site=eq.$SITE_KEY" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1")
          echo "Newest before: $ROW"
          echo "slug=$(printf '%s' "$ROW" | jq -r '.[0].slug // ""')" >> "$GITHUB_OUTPUT"

      - name: Trigger generation
        run: |
          STATUS="${{ inputs.status || 'published' }}"
          PROMPT="${{ inputs.prompt }}"
          echo "Requesting a $STATUS article for $SITE_KEY"
          PAYLOAD=$(jq -nc --arg s "$SITE_KEY" --arg st "$STATUS" --arg p "$PROMPT" \
            '{site: $s, status: $st} + (if $p == "" then {} else {prompt: $p} end)')
          CODE=$(curl -sS -o /tmp/trigger.out -w '%{http_code}' -X POST \
            "$ORIGIN/.netlify/functions/generate-background" \
            -H 'Content-Type: application/json' --data "$PAYLOAD")
          echo "HTTP $CODE"; cat /tmp/trigger.out; echo
          # Background functions answer 202 immediately and keep working.
          case "$CODE" in 202|200) ;; *) echo "::error::trigger failed"; exit 1 ;; esac

      - name: Wait for the new article to land
        run: |
          BEFORE='${{ steps.before.outputs.slug }}'
          for i in $(seq 1 40); do
            sleep 30
            ROW=$(curl -sS -G "$SUPABASE_URL/rest/v1/posts" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
              --data-urlencode "select=slug,title,status,created_at" \
              --data-urlencode "site=eq.$SITE_KEY" \
              --data-urlencode "order=created_at.desc" \
              --data-urlencode "limit=1")
            SLUG=$(printf '%s' "$ROW" | jq -r '.[0].slug // ""')
            if [ -n "$SLUG" ] && [ "$SLUG" != "$BEFORE" ]; then
              echo "New article after $((i * 30))s: $ROW"
              {
                echo "### New article for $SITE_KEY"
                printf '%s' "$ROW" | jq -r '.[0] | "**\(.title)**\n\nstatus: `\(.status)`"'
                echo ""
                echo "$ORIGIN/article/$SLUG"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  ...still generating ($((i * 30))s)"
          done
          echo "::error::No new article appeared within 20 minutes"
          exit 1
